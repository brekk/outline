[[repos]]
repo = "builtin"
hooks = [
  { id = "check-json" },
  { id = "check-toml" },
  { id = "end-of-file-fixer" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id ="madlib-format",
    name="madlib format",
    entry="bash -c 'for x in \"$@\"; do madlib format -i \"$x\" --fix; done' --",
    language="system",
    files = "\\.mad$"
  },
  {
    id ="madlib-readme",
    name="madlib readme",
    entry="pilcrow -i README.md --repo brekk/outline --auto",
    language="system",
    files = "README\\.md$|madlib\\.json$",
    verbose=true
  },
{
    id ="version-check",
    name="ensure project version",
    entry="make src/Version.mad",
    language="system",
    files = "madlib\\.json$",
    pass_filenames=false
  },
  {
    id ="madlib-test",
    name="madlib test",
    entry="madlib test",
    language="system",
    files = "\\.spec\\.mad$",
    pass_filenames = false
  },
]
